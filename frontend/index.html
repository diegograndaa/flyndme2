<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />

    <!-- Anti-flash de tema: fija data-theme ANTES de pintar nada (React lo
         re-sincroniza al montar vía useTheme; misma clave de localStorage). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("flyndme_theme");
          var dark = stored === "dark" || ((stored === null || stored === "system")
            && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) { /* sin localStorage: se queda el tema claro por defecto */ }
      })();
    </script>

    <!-- SEO Meta -->
    <title>FlyndMe — Find the cheapest place to meet your group</title>
    <meta name="description" content="FlyndMe compares flights from multiple cities to find where your group can meet at the lowest total cost, and shows who pays what. Prices are estimates from recent searches." />
    <meta name="keywords" content="group flights, cheapest destination, multi-origin flight search, meet your friends, group travel, fairness score, FlyndMe" />
    <meta name="author" content="FlyndMe" />
    <link rel="canonical" href="https://flyndme2.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="FlyndMe — Find the cheapest place to meet your group" />
    <meta property="og:description" content="Enter each traveler's city and discover where it's cheapest to meet and who pays what. Price estimates from recent searches, flexible dates." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flyndme2.vercel.app/" />
    <meta property="og:site_name" content="FlyndMe" />
    <meta property="og:image" content="https://flyndme2.vercel.app/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlyndMe — Cheapest group flights" />
    <meta name="twitter:description" content="Compare flights from multiple origins and find the best destination for your group." />
    <meta name="twitter:image" content="https://flyndme2.vercel.app/og-preview.png" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default": barra de estado opaca con texto oscuro (con black-translucent el
         texto blanco del sistema no se leía sobre el crema del tema claro). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FlyndMe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />
    <!-- Favicon = logo «Convergencia» (sep-2026): el mismo símbolo que la
         cabecera (logo-flyndme.svg). Se mantiene como archivo aparte por si
         pestaña y cabecera vuelven a divergir. El ?v= obliga a navegadores y
         service worker a pedir el logo nuevo (el favicon se cachea mucho). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />

    <!-- Google Fonts: IBM Plex Sans (UI/cuerpo/títulos) + IBM Plex Mono (panel de salidas: códigos, precios y etiquetas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FlyndMe",
      "url": "https://flyndme2.vercel.app",
      "description": "Compare flights from multiple origins and find the cheapest destination for your group.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "creator": {
        "@type": "Organization",
        "name": "FlyndMe"
      },
      "featureList": [
        "Multi-origin flight search",
        "Group total cost optimization",
        "Fair split between travelers",
        "Flexible date search",
        "Shareable result links",
        "Price estimates from recent searches"
      ]
    }
    </script>

    <!-- Structured Data: FAQPage → habilita rich snippets de FAQ en Google
         (más espacio en resultados + CTR). Refleja el FAQ de la home
         (src/i18n/en.json → landing.faqs); mantener en sync si cambia. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does FlyndMe sell tickets?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. We recommend the best destination and each traveler books their own flight directly on Aviasales, Skyscanner or Google Flights." }
        },
        {
          "@type": "Question",
          "name": "How do you know if a destination is fair for everyone?",
          "acceptedAnswer": { "@type": "Answer", "text": "We compare what each traveler pays: you'll see one bar per city and the gap between who pays most and least. With “Most balanced” we rank by the most even split, even if the total is a bit higher." }
        },
        {
          "@type": "Question",
          "name": "How many travelers can I add?",
          "acceptedAnswer": { "@type": "Answer", "text": "Up to 8 departure cities and 16 travelers in total (up to 9 from the same city)." }
        },
        {
          "@type": "Question",
          "name": "Are the prices exact?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. They're estimates based on recent searches and may have changed. Before booking you can check the recommended destination's price live, and the final price is the one on the site where you book." }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
